<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
  <style>
    body { padding: 12px; font-size: 13px; }
    label.block { display: block; font-weight: 500; margin: 10px 0 4px; }
    select, input[type=number] { width: 100%; box-sizing: border-box; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    .check { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
    .swatch { display: flex; height: 22px; border-radius: 4px; overflow: hidden; margin-top: 6px; border: 1px solid #dadce0; }
    .swatch span { flex: 1; }
    .swatch .bg { flex: 2; display: flex; align-items: center; padding-left: 6px; font: 11px 'Roboto Mono', monospace; }
    .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .buttons button { margin: 0; }
    #status { margin-top: 10px; min-height: 18px; color: #5f6368; }
    #status.error { color: #d93025; }
    pre#preview { display: none; margin-top: 10px; padding: 10px; border-radius: 6px; overflow: auto;
      max-height: 320px; font: 12px/1.45 'Roboto Mono', Consolas, monospace; white-space: pre; }
    .warn { display: none; margin-top: 6px; color: #b06000; font-size: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <label class="block" for="lang">Language</label>
  <select id="lang"></select>

  <div class="row">
    <div>
      <label class="block" for="theme">Theme</label>
      <select id="theme"></select>
    </div>
    <div style="flex:0 0 80px">
      <label class="block" for="mode">Mode</label>
      <select id="mode" title="Light colors are dark enough for white or light gray pages">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
  </div>
  <div class="swatch" id="swatch"></div>
  <div class="warn" id="modeWarn">Dark mode needs a background. Turn one on, or use Light.</div>

  <div class="row">
    <div>
      <label class="block" for="font">Font</label>
      <select id="font"></select>
    </div>
    <div style="flex:0 0 70px">
      <label class="block" for="fontSize">Size</label>
      <input type="number" id="fontSize" min="0" max="72" step="1" title="0 keeps the current size">
    </div>
  </div>

  <div class="check"><input type="checkbox" id="fullWidth"><label for="fullWidth" title="Shade whole lines from margin to margin">Full-width block</label></div>
  <div class="check"><input type="checkbox" id="background"><label for="background" title="Theme background behind the text only">Text background</label></div>
  <div class="check"><input type="checkbox" id="fontStyles"><label for="fontStyles" title="Bold / italic from the theme">Bold / italic</label></div>

  <div class="buttons">
    <button class="action" id="btnApply">Highlight</button>
    <button id="btnPreview">Preview</button>
    <button id="btnClear">Clear</button>
  </div>
  <div id="status"></div>
  <pre id="preview"></pre>

<script>
  var cfg = null;
  var $ = function (id) { return document.getElementById(id); };

  function option(value, text) { var o = document.createElement('option'); o.value = value; o.textContent = text; return o; }

  function init(c) {
    cfg = c;
    $('lang').appendChild(option('auto', 'Auto-detect'));
    c.languages.forEach(function (l) { $('lang').appendChild(option(l.id, l.name)); });

    c.themes.forEach(function (t) { $('theme').appendChild(option(t.id, '')); });

    $('font').appendChild(option('keep', '(keep current)'));
    c.fonts.forEach(function (f) { $('font').appendChild(option(f, f)); });

    var s = c.settings;
    $('lang').value = s.lang; $('theme').value = s.theme; $('mode').value = s.mode; $('font').value = s.font;
    $('fontSize').value = s.fontSize; $('background').checked = s.background; $('fontStyles').checked = s.fontStyles;
    $('fullWidth').checked = s.fullWidth;
    renderTheme();
  }

  /** Shows each theme under its name for the current mode, plus the swatch and dark-mode warning. */
  function renderTheme() {
    var mode = $('mode').value;
    Array.prototype.forEach.call($('theme').options, function (o, k) { o.textContent = cfg.themes[k][mode].name; });
    var t = cfg.themes.filter(function (x) { return x.id === $('theme').value; })[0];
    if (!t) return;
    t = t[mode];
    var html = '<span class="bg" style="background:' + t.bg + ';color:' + t.fg + '">Aa</span>';
    t.swatch.forEach(function (col) { html += '<span style="background:' + col + '"></span>'; });
    $('swatch').innerHTML = html;
    $('swatch').title = 'keyword · string · function · type · ROS 2 · Docker';
    // the full-width block already uses the theme background
    $('background').disabled = $('fullWidth').checked;
    var hasBg = $('fullWidth').checked || $('background').checked;
    $('modeWarn').style.display = mode === 'dark' && !hasBg ? 'block' : 'none';
  }

  function opts() {
    return {
      lang: $('lang').value, theme: $('theme').value, mode: $('mode').value, font: $('font').value,
      fontSize: Number($('fontSize').value) || 0,
      background: $('background').checked, fontStyles: $('fontStyles').checked, fullWidth: $('fullWidth').checked
    };
  }

  function status(msg, isError) { $('status').textContent = msg; $('status').className = isError ? 'error' : ''; }

  function busy(on) { ['btnApply', 'btnPreview', 'btnClear'].forEach(function (id) { $(id).disabled = on; }); }

  function call(fn, onOk, label) {
    busy(true); status(label);
    google.script.run
      .withSuccessHandler(function (r) { busy(false); onOk(r); })
      .withFailureHandler(function (e) { busy(false); status(e.message || String(e), true); })[fn](opts());
  }

  ['theme', 'mode', 'background', 'fullWidth'].forEach(function (id) { $(id).addEventListener('change', renderTheme); });

  $('btnApply').addEventListener('click', function () {
    call('highlightSelection', function (r) {
      status('Done · ' + shortName(r.langName));
    }, 'Highlighting…');
  });

  $('btnPreview').addEventListener('click', function () {
    call('previewSelection', function (r) {
      var p = $('preview');
      p.style.display = 'block'; p.style.background = r.bg; p.style.color = r.fg;
      p.innerHTML = r.html;
      status(shortName(r.langName) + (r.truncated ? ' · first 5000 characters' : ''));
    }, 'Rendering…');
  });

  $('btnClear').addEventListener('click', function () {
    call('clearSelection', function () { status('Cleared'); }, 'Clearing…');
  });

  /** "Bash / Shell (ROS 2 + Docker aware)" -> "Bash / Shell" */
  function shortName(name) { return name.replace(/\s*\(.*\)$/, ''); }

  google.script.run
    .withSuccessHandler(init)
    .withFailureHandler(function (e) { status(e.message || String(e), true); })
    .getConfig();
</script>
</body>
</html>
